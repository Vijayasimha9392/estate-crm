spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/estate_crm?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm-local-password}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
app:
  timezone: Asia/Kolkata
  seed-demo: ${SEED_DEMO:false}
