services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: estate_crm
      MYSQL_USER: crm
      MYSQL_PASSWORD: "${DB_PASSWORD:-crm-local-password}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root-local-password}"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - crm-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DB_URL: "jdbc:mysql://db:3306/estate_crm?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
      DB_USER: crm
      DB_PASSWORD: "${DB_PASSWORD:-crm-local-password}"
      SEED_DEMO: "${SEED_DEMO:-true}"
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:80"

volumes:
  crm-data: